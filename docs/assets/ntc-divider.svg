<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" role="img" aria-labelledby="t-ntc d-ntc">
  <title id="t-ntc">NTC thermistor voltage-divider topology and resistance-temperature curve</title>
  <desc id="d-ntc">Left: pull-up R_series from VREF to the divider node, NTC to GND. The MCU ADC reads V_div which the driver maps to temperature via lookup table or beta-equation. Right: typical R(T) curve showing the negative temperature coefficient.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .panel    { fill: #ffffff; }
      .panelL   { fill: #ffffff; stroke: #1a365d; stroke-width: 2; }
      .driver   { fill: #ebf4ff; stroke: #2c5282; stroke-width: 2; }
      .ntcBox   { fill: #ffffff; stroke: #1a365d; stroke-width: 2; }
      .wire     { stroke: #1a365d; stroke-width: 2; fill: none; }
      .wire-pwr { stroke: #c53030; stroke-width: 2.5; fill: none; }
      .wire-gnd { stroke: #4a5568; stroke-width: 2.5; fill: none; }
      .wire-sig { stroke: #2b6cb0; stroke-width: 2.5; fill: none; }
      .axis     { stroke: #1a365d; stroke-width: 1.5; fill: none; }
      .grid     { stroke: #cbd5e0; stroke-width: 1; stroke-dasharray: 4 4; }
      .curve    { stroke: #c05621; stroke-width: 3; fill: none; }
      .head     { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: #1a365d; text-anchor: middle; }
      .title    { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #1a365d; text-anchor: middle; }
      .titleL   { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #1a365d; text-anchor: start; }
      .small    { font-family: system-ui, sans-serif; font-size: 11px; fill: #4a5568; text-anchor: middle; }
      .smallL   { font-family: system-ui, sans-serif; font-size: 11px; fill: #4a5568; text-anchor: start; }
      .smallR   { font-family: system-ui, sans-serif; font-size: 11px; fill: #4a5568; text-anchor: end; }
      .pin      { font-family: "DejaVu Sans Mono", Consolas, monospace; font-size: 11px; fill: #1a202c; text-anchor: middle; }
      .pinL     { font-family: "DejaVu Sans Mono", Consolas, monospace; font-size: 11px; fill: #1a202c; text-anchor: start; }
      .pinR     { font-family: "DejaVu Sans Mono", Consolas, monospace; font-size: 11px; fill: #1a202c; text-anchor: end; }
      .eq       { font-family: system-ui, sans-serif; font-size: 12px; fill: #1a202c; font-style: italic; }
      .legend   { font-family: system-ui, sans-serif; font-size: 11px; fill: #4a5568; }
    ]]></style>
  </defs>
  <rect class="panel" width="880" height="460"/>

  <text class="head"  x="440" y="26">NTC thermistor - voltage-divider topology and R(T) characteristic</text>
  <text class="small" x="440" y="44">The driver consumes a single ADC voltage and resolves it to degrees Celsius via lookup table (fast) or beta-equation (accurate).</text>

  <!-- LEFT panel: schematic (x=20..420, y=64..360) -->
  <rect class="panelL" x="20" y="64" width="400" height="296" rx="6"/>
  <text class="title" x="220" y="86">Voltage-divider schematic</text>

  <!--
    Layout:
      VREF rail at y=110
      R_series (zigzag) from y=110..200
      Node V_div at y=210, side branch -> ADC arrow at right
      NTC variable-resistor box from y=220..280
      GND rail at y=300
  -->

  <!-- VREF rail -->
  <line class="wire-pwr" x1="80" y1="110" x2="380" y2="110"/>
  <text class="pinR" x="74" y="114">VREF</text>

  <!-- Down-wire from VREF to R_series top -->
  <line class="wire" x1="220" y1="110" x2="220" y2="138"/>

  <!-- R_series (zigzag, 60 px tall) -->
  <polyline class="wire" points="220,138 208,148 232,160 208,172 232,184 220,196"/>
  <text class="titleL" x="240" y="166">R_series</text>
  <text class="smallL" x="240" y="184">10 k&#937; typ.</text>

  <!-- Vertical wire from R_series bottom to V_div node -->
  <line class="wire" x1="220" y1="196" x2="220" y2="216"/>

  <!-- V_div node + branch to ADC -->
  <circle cx="220" cy="216" r="3.5" fill="#1a365d"/>
  <line class="wire-sig" x1="220" y1="216" x2="380" y2="216"/>
  <polyline points="380,216 372,212 372,220" fill="#2b6cb0"/>
  <text class="pinR" x="374" y="208">V_div  -&gt;  ADC</text>

  <!-- NTC box (rectangle with diagonal arrow indicating variable) -->
  <line class="wire" x1="220" y1="216" x2="220" y2="226"/>
  <rect class="ntcBox" x="206" y="226" width="28" height="60"/>
  <line stroke="#c05621" stroke-width="2" x1="196" y1="294" x2="248" y2="232"/>
  <polyline points="248,232 240,232 244,240" fill="#c05621"/>
  <text class="titleL" x="260" y="246">NTC</text>
  <text class="smallL" x="260" y="262">R_T(T) - negative</text>
  <text class="smallL" x="260" y="278">temperature coefficient</text>

  <!-- Wire from NTC bottom to GND -->
  <line class="wire" x1="220" y1="286" x2="220" y2="300"/>

  <!-- GND rail -->
  <line class="wire-gnd" x1="80" y1="300" x2="380" y2="300"/>
  <text class="pinR" x="74" y="304">GND</text>

  <!-- Equations under schematic -->
  <text class="eq"  x="40" y="328">V_div  =  VREF &#183; R_T / (R_T + R_series)</text>
  <text class="eq"  x="40" y="346">=&gt;  R_T  =  R_series &#183; V_div / (VREF - V_div)</text>

  <!-- RIGHT panel: R(T) curve (x=440..860, y=64..280) -->
  <rect class="panelL" x="440" y="64" width="420" height="216" rx="6"/>
  <text class="title" x="650" y="86">R(T) - typical 10 k&#937; NTC, &#946; = 3435 K</text>

  <!--
    Plot area: x=490..830 (340 px), y=110..256 (146 px)
    X axis: T in degC, range -40..125 (165 deg) -> 340 px -> 2.0606 px/deg
      x(T) = 490 + (T+40) * 2.0606
    Y axis: log scale 100 ohm..1 Mohm (4 decades) -> 146 px -> 36.5 px/decade
      y(R) = 110 + (3 - log10(R_kohm)) * 36.5
      anchors: y(1000)=110, y(100)=146.5, y(10)=183, y(1)=219.5, y(0.1)=256
    Anchor points (typical 10 kohm beta=3435 NTC):
      T=-40 -> ~330 kohm  : x= 490 ; y= 110 + (3-log10(330))*36.5 = 110 + (3-2.519)*36.5 = 127.6
      T=  0 -> ~32 kohm   : x= 490+82.4=572.4; y= 110 + (3-1.505)*36.5 = 164.6
      T= 25 -> 10 kohm    : x= 490+133.9=623.9; y= 110 + (3-1.000)*36.5 = 183.0
      T= 50 -> ~3.6 kohm  : x= 490+185.4=675.4; y= 110 + (3-0.556)*36.5 = 199.2
      T=100 -> ~0.66 kohm : x= 490+288.5=778.5; y= 110 + (3-(-0.180))*36.5 = 226.1
      T=125 -> ~0.32 kohm : x= 490+340=830  ; y= 110 + (3-(-0.495))*36.5 = 237.6
  -->

  <!-- gridlines -->
  <line class="grid" x1="490" y1="146.5" x2="830" y2="146.5"/>
  <line class="grid" x1="490" y1="183"   x2="830" y2="183"/>
  <line class="grid" x1="490" y1="219.5" x2="830" y2="219.5"/>
  <line class="grid" x1="572.4" y1="110" x2="572.4" y2="256"/>
  <line class="grid" x1="623.9" y1="110" x2="623.9" y2="256"/>
  <line class="grid" x1="675.4" y1="110" x2="675.4" y2="256"/>
  <line class="grid" x1="778.5" y1="110" x2="778.5" y2="256"/>

  <!-- axes -->
  <line class="axis" x1="490" y1="256" x2="830" y2="256"/>
  <line class="axis" x1="490" y1="110" x2="490" y2="256"/>

  <!-- Y labels -->
  <text class="smallR" x="486" y="114">1 M&#937;</text>
  <text class="smallR" x="486" y="150">100 k&#937;</text>
  <text class="smallR" x="486" y="187">10 k&#937;</text>
  <text class="smallR" x="486" y="223">1 k&#937;</text>
  <text class="smallR" x="486" y="259">100 &#937;</text>

  <!-- X labels -->
  <text class="small" x="490"   y="270">-40</text>
  <text class="small" x="572.4" y="270">0</text>
  <text class="small" x="623.9" y="270">25</text>
  <text class="small" x="675.4" y="270">50</text>
  <text class="small" x="778.5" y="270">100</text>
  <text class="small" x="830"   y="270">125</text>

  <!-- curve (smoothed log-axis path through anchors) -->
  <path class="curve" d="M 490 127.6 C 530 152, 545 158, 572.4 164.6 C 600 173, 610 178, 623.9 183 C 645 192, 660 196, 675.4 199.2 C 720 213, 750 222, 778.5 226.1 C 805 233, 818 236, 830 237.6"/>

  <!-- 25 degC marker -->
  <circle cx="623.9" cy="183" r="4" fill="#c05621" stroke="#1a365d" stroke-width="1.5"/>
  <text class="smallL" x="635" y="180">25 &#176;C  -&gt;  10 k&#937;  (&#946; anchor)</text>

  <!-- BOTTOM panel: driver pipeline (x=20..860, y=380..420) -->
  <rect class="driver" x="20" y="376" width="840" height="58" rx="6"/>
  <text class="title" x="440" y="396">HF NTC driver pipeline</text>
  <text class="small" x="440" y="414">ADC adapter -&gt; V_div -&gt; R_T -&gt; lookup table OR beta-equation -&gt; Celsius / Fahrenheit / Kelvin (filter + multi-sample averaging)</text>

  <!-- Bottom legend in its own row -->
  <g transform="translate(30, 446)">
    <text class="titleL" x="0" y="0" fill="#1a365d">Legend</text>
    <line class="wire-pwr" x1="80"  y1="-3" x2="104" y2="-3"/>
    <text class="legend" x="112" y="0">VREF (ADC reference rail)</text>
    <line class="wire-gnd" x1="280" y1="-3" x2="304" y2="-3"/>
    <text class="legend" x="312" y="0">GND</text>
    <line class="wire-sig" x1="380" y1="-3" x2="404" y2="-3"/>
    <text class="legend" x="412" y="0">V_div to ADC input</text>
    <line class="curve"    x1="540" y1="-3" x2="564" y2="-3"/>
    <text class="legend" x="572" y="0">R(T) curve (typical 10 k&#937;, &#946; = 3435)</text>
  </g>
</svg>
